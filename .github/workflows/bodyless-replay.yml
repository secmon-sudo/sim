name: Body-less Replay

# Would the article body have changed what Pass C decided?
#
# A third of everything SIM classifies arrives with no body (2,620 of 8,025 fetches in
# the week to 2026-09-09), and that cohort is archived more, tiered less, and carries
# time_certainty='unknown' 90.6% of the time against 69.2% for the rest. Whether the
# BODY is the cause or those articles were simply the low-value ones is the question
# this answers, by re-running the real Pass C prompt over the same reports twice.
#
# Manual only. It is a measurement, not a stage: it writes nothing, and its bodies are
# committed in db/replay/ so a re-run months from now is comparable.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Pin one slot (blank = production cascade)"
        default: ""
      model:
        description: "Model id (only with provider)"
        default: ""

# The full key set: with no --provider the script builds the PRODUCTION cascade, and a
# missing key there is a silently skipped slot, not an error.
env:
  GROQ_API_KEY_A:       ${{ secrets.GROQ_API_KEY_A }}
  GROQ_API_KEY_B:       ${{ secrets.GROQ_API_KEY_B }}
  OPENROUTER_API_KEY_A: ${{ secrets.OPENROUTER_API_KEY_A }}
  OPENROUTER_API_KEY_B: ${{ secrets.OPENROUTER_API_KEY_B }}
  GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3:     ${{ secrets.GEMINI_API_KEY_3 }}
  MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
  LLM7_KEY:             ${{ secrets.LLM7_KEY }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Replay
        run: |
          python -m scripts.replay_bodyless \
            --provider "${{ inputs.provider }}" \
            --model "${{ inputs.model }}"
