name: SIM Severity Replay

# Read-only measurement, manually triggered: recompute severity under a proposed
# catalog rescale and report the delta, including how many alerts would stop paging.
#
# It runs here rather than locally because the two inputs that dominate the score are
# not recoverable from the stored rows — severity is persisted post-clip, and
# anchor_data["confidence"] is never persisted at all. An aggregate-based
# reconstruction reproduced only 52% of stored severities, which is nowhere near
# enough to decide an alert-volume change on. The script reports its own fidelity
# first and the number is only trustworthy when that reads ~100%.
#
# See scripts/replay_severity.py for the measurements that motivated this.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window to replay, in days"
        required: true
        default: "14"
      base_cap:
        description: "Proposed ceiling for event_type_catalog.severity_base"
        required: true
        default: "75"
      mode:
        description: "cap = min(base,cap); compress = keep type ordering"
        required: true
        default: "compress"
        type: choice
        options: ["compress", "cap"]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tee to a file as well as the log. Workflow logs need a GitHub token to
      # read, so a measurement that only ever reaches stdout cannot be collected
      # without one — the first run of this workflow produced its numbers and
      # nobody could retrieve them. The artifact is downloadable from the run page
      # and via nightly.link, which is how the rest of this repo's output is read.
      - name: Replay severity
        # shell: bash is load-bearing. The default runner shell is `bash -e`
        # WITHOUT pipefail, so `python ... | tee` would report tee's exit code
        # and a crashed replay would show up as a green step with an empty file.
        shell: bash
        run: >-
          python -m scripts.replay_severity
          --days "${{ inputs.days }}"
          --base-cap "${{ inputs.base_cap }}"
          --mode "${{ inputs.mode }}"
          2>&1 | tee severity-replay.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ inputs.mode }}-${{ inputs.base_cap }}-${{ inputs.days }}d
          path: severity-replay.txt
          retention-days: 30
