name: SIM Vocabulary Audit

# Weekly measurement of what the semantic gates throw away.
#
# The gates that decide what enters this pipeline are hand-maintained regex
# lexicons, and three gaps in a row were found by accident months apart: the
# prescreen's noun-phrase blindness (2026-08-11), the missing "kill" verb
# (2026-08-17, 89 mass-casualty attacks scored 0 in 14 days) and the missing
# "diverted"/"delayed" aviation verbs (2026-08-23). This job samples the
# REJECTED side of each gate, has a cheap model judge whether the rejection was
# right, and writes the miss rate to system_telemetry — so the next gap arrives
# as a trend instead of a coincidence.
#
# Read-only: it fetches the same RSS Pass A does and writes nothing to `events`.
# Scheduled at 05:00 UTC Monday, between pipeline runs (which land on even hours)
# and before the 07:30 SITREP, so the two never compete for the same feeds.
#
# See scripts/vocab_audit.py for the reasoning behind the sample size and the
# alert threshold.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      samples:
        description: "Headlines sampled per gate"
        required: true
        default: "40"
      threshold:
        description: "Miss rate that pages ops (0.10 = 10%)"
        required: true
        default: "0.10"
      days:
        description: "Window for the prescreen gate, in days"
        required: true
        default: "7"
      dry_run:
        description: "Print only — no telemetry row, no Telegram"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: vocab-audit
  cancel-in-progress: false

env:
  DATABASE_URL:            ${{ secrets.DATABASE_URL }}
  # The judge runs on the bulk router (gpt-oss-20b pooled across both Groq keys),
  # deliberately off the classification quota — an audit must never be the reason
  # Pass C runs out of model.
  GROQ_API_KEY_A:          ${{ secrets.GROQ_API_KEY_A }}
  GROQ_API_KEY_B:          ${{ secrets.GROQ_API_KEY_B }}
  OPENROUTER_API_KEY_A:    ${{ secrets.OPENROUTER_API_KEY_A }}
  OPENROUTER_API_KEY_B:    ${{ secrets.OPENROUTER_API_KEY_B }}
  TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
  TELEGRAM_OPS_CHAT_ID:    ${{ secrets.TELEGRAM_OPS_CHAT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    # The fetch dominates: ~50 query feeds plus the configured publisher list,
    # then ~12 judge calls. Comfortably inside 20 minutes; the ceiling is here so
    # a hanging feed cannot hold a runner for six hours.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run vocabulary audit
        run: |
          python -m scripts.vocab_audit \
            --samples "${{ github.event.inputs.samples || '40' }}" \
            --threshold "${{ github.event.inputs.threshold || '0.10' }}" \
            --days "${{ github.event.inputs.days || '7' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            2>&1 | tee vocab_audit.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocab-audit-${{ github.run_number }}
          path: vocab_audit.log
          retention-days: 30
