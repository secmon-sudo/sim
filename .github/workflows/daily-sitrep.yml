name: Daily Country SITREP

# TETİKLEYİCİ YALNIZCA workflow_dispatch. GitHub'ın kendi `schedule` cron'u
# ('30 7 * * *') 2026-08-27'de KALDIRILDI — çalışmadığı için değil, GÜVENİLMEZ
# çalıştığı için: 27 Ağustos'ta 00:56-11:45 arası bu repoda hiçbir zamanlanmış
# workflow tetiklenmedi (saatlik deadman'de 10,8 saatlik boşluk; son 40 koşuda
# ortalama ara 1,5 saat, 39 aranın 10'u 1,5 saati aşıyor). O günün 07:30 SITREP'i
# yuvasını kaçırdı ve ancak 18:22'de, ~11 saat gecikmeyle dağıtıldı.
#
# Aynı pencerede OSINT pipeline saniyesinde koştu, çünkü onun dakik koşuları
# cron-job.org'dan gelen workflow_dispatch — GitHub cron'undan değil. Aynı
# tespit osint-pipeline.yml'de zaten yazılı ("unreliable — cron-job.org dispatch
# is the backstop"); orada iki tetikleyici yan yana duruyor çünkü fazladan bir
# koşunun maliyeti yok. Burada var: ikinci koşu raporu yeniden üretip Telegram'a
# tekrar gönderir, yani kullanıcıya görünen bir kopya. Bu yüzden cron burada
# yedek olarak BIRAKILMADI, kaldırıldı.
#
# ⚠ Sonuç olarak bu iş artık YALNIZCA dışarıdan tetikleniyor. cron-job.org'daki
# job silinir veya token'ı süresi dolarsa günlük SITREP sessizce durur — hiçbir
# şey hata vermez, rapor sadece çıkmaz. Kurulum:
#   POST https://api.github.com/repos/secmon-sudo/sim/actions/workflows/daily-sitrep.yml/dispatches
#   body: {"ref":"master"}   → HTTP 204
#
# ⚠ Dış zamanlama 07:30 UTC olarak KALMALI: Gemini RPD kotası 07:00 UTC'de
# (Pasifik gece yarısı) sıfırlanır. Eskiden 06:00'daydı ve her gün tükenmiş
# kotayla koşuyordu. 07:30 = taze kota + ingest/haftalık raporla çakışmama.
on:
  workflow_dispatch:       # cron-job.org (günlük 07:30 UTC) veya GitHub UI'dan el ile
    inputs:
      countries:
        description: 'ISO2 ülke kodları (boşlukla ayrılmış, örn: IR IQ). Boş bırakılırsa otomatik seçim.'
        required: false
        default: ''

concurrency:
  group: daily-sitrep
  cancel-in-progress: false

env:
  GROQ_API_KEY_A:       ${{ secrets.GROQ_API_KEY_A }}
  GROQ_API_KEY_B:       ${{ secrets.GROQ_API_KEY_B }}
  OPENROUTER_API_KEY_A: ${{ secrets.OPENROUTER_API_KEY_A }}
  OPENROUTER_API_KEY_B: ${{ secrets.OPENROUTER_API_KEY_B }}
  GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
  # The two GEMINI keys above are still live — the main LLM router uses Gemini
  # slots. What is gone is Search grounding: Google retired the last free-tier
  # model that supported it (gemini-2.5-flash-lite, 2026-07-09), and the
  # enrichment pass that depended on it was removed on 2026-08-01 along with its
  # SITREP_GEMINI_MODEL* vars. Restoring web enrichment means picking a new
  # search provider, not re-adding these.
  MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
  LLM7_KEY:             ${{ secrets.LLM7_KEY }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  DATABASE_URL:         ${{ secrets.DATABASE_URL }}
  TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
  TELEGRAM_ARCHIVE_CHAT_ID: ${{ secrets.TELEGRAM_ARCHIVE_CHAT_ID }}
  R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
  R2_PUBLIC_URL_BASE:   ${{ secrets.R2_PUBLIC_URL_BASE }}

jobs:
  sitrep_run:
    runs-on: ubuntu-latest
    # 5 countries + digest ran in ~9 min at the old 4K-token narrative budget. The
    # budget is now 6K with a 180s per-call timeout, so the worst case (every country
    # running the full timeout) needs headroom the old 20 min did not have.
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DB migrations
        run: |
          python -c "
          import os, glob, psycopg
          db_url = os.environ['DATABASE_URL']
          conn = psycopg.connect(db_url, autocommit=True)
          for sql_file in sorted(glob.glob('db/migrations/*.sql')):
              print(f'Running {sql_file}...')
              with open(sql_file) as f:
                  try:
                      conn.execute(f.read())
                      print(f'  OK')
                  except Exception as e:
                      print(f'  SKIP ({e})')
          conn.close()
          print('Migrations complete')
          "

      - name: Run Daily SITREP Pipeline
        run: python -m src.pipeline.orchestrator --sitrep ${{ github.event.inputs.countries }}

      - name: Upload telemetry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitrep-run-${{ github.run_id }}
          path: logs/
          retention-days: 7
