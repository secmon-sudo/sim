name: Model Probe

# Manual only. Runs a candidate model through the REAL Pass C classification
# prompt and uploads the answers, so a new slot is chosen on output rather than
# on catalog copy. Costs a handful of LLM calls and touches no database.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "provider:model çiftleri, virgülle (ör. gemini:gemma-4-31b-it,gemini:gemma-4-26b-a4b-it)"
        type: string
        default: ""
      extras:
        description: 'payload_extras JSON, ör. {"reasoning_effort":"none"}'
        type: string
        default: ""
      catalogues:
        description: "Katalogu listelenecek sağlayıcılar (gemini,groq,llm7)"
        type: string
        default: "gemini,groq,llm7"

env:
  GROQ_API_KEY_A:       ${{ secrets.GROQ_API_KEY_A }}
  GROQ_API_KEY_B:       ${{ secrets.GROQ_API_KEY_B }}
  OPENROUTER_API_KEY_A: ${{ secrets.OPENROUTER_API_KEY_A }}
  OPENROUTER_API_KEY_B: ${{ secrets.OPENROUTER_API_KEY_B }}
  GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
  MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
  LLM7_KEY:             ${{ secrets.LLM7_KEY }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe
        shell: bash
        run: |
          # pipefail: `python ... | tee` reports TEE's exit status, so a crashed
          # probe was reported as a green job (2026-09-02) and the models queued
          # behind it were silently never tested.
          set -o pipefail
          mkdir -p logs
          # Catalogues run first and always: dashboards and deprecation emails name
          # models by display name ("Gemma 4 31B", "Qwen3.8-27B") while the API wants a
          # slug, so a probe against a guessed id fails for the boring reason and says
          # nothing about the model. One dispatch answers both questions.
          python -m scripts.probe_models --list "${{ inputs.catalogues }}" \
            --models "${{ inputs.models }}" --extras '${{ inputs.extras }}' \
            2>&1 | tee logs/probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-probe-${{ github.run_id }}
          path: logs/probe.txt
          retention-days: 7
