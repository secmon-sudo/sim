name: Model Probe

# Two jobs in one workflow.
#
# `probe` is manual: it runs a CANDIDATE model through the real prompts and
# uploads the answers, so a new slot is chosen on output rather than on catalog
# copy. Costs a handful of LLM calls and touches no database.
#
# `regression` is weekly: it runs the slots PRODUCTION ALREADY USES through the
# same prompts, and pages ops when one of them stops working. A model is a
# dependency with no version pin and no changelog — gemini-2.5-flash-lite was
# retired early and answered 404 for a fortnight, Groq deprecated a Pass C model
# with a week's notice, Cerebras' free tier ended mid-run, OpenRouter's free
# gpt-oss family vanished. None of that shows up until a report looks wrong, and
# by then it has been wrong for a while. Monday 06:00 UTC, before the 07:30
# SITREP, so a failure is known before the day's reports are written.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      models:
        description: "provider:model çiftleri, virgülle (ör. gemini:gemma-4-31b-it,gemini:gemma-4-26b-a4b-it)"
        type: string
        default: ""
      extras:
        description: 'payload_extras JSON, ör. {"reasoning_effort":"none"}'
        type: string
        default: ""
      catalogues:
        description: "Katalogu listelenecek sağlayıcılar (gemini,groq,llm7)"
        type: string
        default: "gemini,groq,llm7"
      prose:
        description: "Pass C yerine GERÇEK Türkçe SITREP anlatıcısını koştur (kalite router slotları için)"
        type: boolean
        default: false
      bulletin:
        description: "İran bülteninin yön/iddia çıkarımını gerçek tuzaklı manşetlerde koştur"
        type: boolean
        default: false
      regression:
        description: "ÜRETİMDEKİ tüm slotları sına ve başarısızlıkta ops'a sayfala (haftalık cron bunu zaten yapar)"
        type: boolean
        default: false

env:
  GROQ_API_KEY_A:       ${{ secrets.GROQ_API_KEY_A }}
  GROQ_API_KEY_B:       ${{ secrets.GROQ_API_KEY_B }}
  OPENROUTER_API_KEY_A: ${{ secrets.OPENROUTER_API_KEY_A }}
  OPENROUTER_API_KEY_B: ${{ secrets.OPENROUTER_API_KEY_B }}
  GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3:     ${{ secrets.GEMINI_API_KEY_3 }}
  MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
  LLM7_KEY:             ${{ secrets.LLM7_KEY }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe
        shell: bash
        run: |
          # pipefail: `python ... | tee` reports TEE's exit status, so a crashed
          # probe was reported as a green job (2026-09-02) and the models queued
          # behind it were silently never tested.
          set -o pipefail
          mkdir -p logs
          # Catalogues run first and always: dashboards and deprecation emails name
          # models by display name ("Gemma 4 31B", "Qwen3.8-27B") while the API wants a
          # slug, so a probe against a guessed id fails for the boring reason and says
          # nothing about the model. One dispatch answers both questions.
          python -m scripts.probe_models --list "${{ inputs.catalogues }}" \
            --models "${{ inputs.models }}" --extras '${{ inputs.extras }}' \
            ${{ inputs.prose && '--prose' || '' }} \
            ${{ inputs.bulletin && '--bulletin' || '' }} \
            2>&1 | tee logs/probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-probe-${{ github.run_id }}
          path: logs/probe.txt
          retention-days: 7

  # Scheduled always; on a manual dispatch ONLY when asked. It used to run on
  # every dispatch, which meant probing one candidate model silently re-ran the
  # whole production cascade behind it — 17 times on 2026-09-04, each one burning
  # a full set of real LLM calls and paging the ops channel when a known-bad slot
  # failed. Probing a candidate and auditing production are different jobs and
  # only one of them should page anybody.
  regression:
    if: github.event_name == 'schedule' || inputs.regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe the slots production uses
        id: regression
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p logs
          # Exit code carries the verdict: 0 clean, 1 a model answered and did the
          # job badly, 2 a model could not be reached at all. Those are different
          # problems and the page below says which.
          #
          # `set +e` around the call is not decoration: GitHub runs `shell: bash`
          # as `bash -e -o pipefail`, so a non-zero pipeline aborts the script
          # then and there and the line that captures the code never runs. The
          # step would have reported success for every outcome.
          set +e
          python -m scripts.probe_models --regression 2>&1 | tee logs/regression.txt
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "probe exited $CODE"

      - name: Page ops
        if: steps.regression.outputs.code != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          TELEGRAM_OPS_CHAT_ID:    ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          CODE: ${{ steps.regression.outputs.code }}
        continue-on-error: true
        shell: bash
        run: |
          # Verdict lines only. The full transcript is in the artifact, and a page
          # nobody can read on a phone is a page nobody reads.
          SUMMARY=$(grep -E "^  ✗ |^  ~ |^REGRESSION" logs/regression.txt | head -20)
          export SUMMARY
          python -c "
          import os
          from src.services.ops_notifier import send_ops_alert
          summary = os.environ.get('SUMMARY', '').strip() or '(özet çıkarılamadı)'
          regressed = os.environ.get('CODE') == '1'
          head = ('⚠️ Haftalık slot probu: üretimde kullanılan bir model artık '
                  'işini yapmıyor.' if regressed else
                  'ℹ️ Haftalık slot probu: bir slota hiç ulaşılamadı (kota/kesinti). '
                  'Model bozulmadı, ama o slot bugün rapor yazamaz.')
          send_ops_alert(
              head + '\n\n' + summary +
              '\n\nTam çıktı: Actions > Model Probe > regression artifact.',
              title='SIM MODEL REGRESYONU')
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-regression-${{ github.run_id }}
          path: logs/regression.txt
          retention-days: 30

      # Red only for a real regression. An unreachable slot is reported and
      # kept green: a weekly job that goes red every time a free tier rate-limits
      # is a job people stop looking at, and then it is worth less than nothing.
      - name: Fail the job when a model regressed
        if: steps.regression.outputs.code == '1'
        run: exit 1
